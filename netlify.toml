# Netlify build filter
#
# The `ignore` command runs before each build. If it exits 0, Netlify SKIPS the
# build. `git diff --quiet` exits 0 when there is no diff, 1 when there is.
#
# Translation: skip the build unless something inside viewer/ has changed
# between the last deployed commit and the current commit. This means daily
# brief commits to briefs/ will NOT trigger Netlify rebuilds, preserving the
# free-tier deploy quota.

[build]
  base = "viewer"
  publish = "."
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- viewer/"
