<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Morning Brief</title>

  <!-- OpenGraph / Twitter meta for link shares -->
  <meta name="description" content="Daily tech and AI news brief — read slowly over coffee.">
  <meta property="og:title" content="The Morning Brief">
  <meta property="og:description" content="Daily tech and AI news brief — read slowly over coffee.">
  <meta property="og:type" content="article">
  <meta property="og:site_name" content="The Morning Brief">
  <meta name="twitter:card" content="summary">

  <!-- Google Fonts: DM Serif Display (headlines), Literata (body), Inter (metadata) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Literata:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Marked.js: converts Markdown to HTML -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <!-- js-yaml: parses the YAML frontmatter block at the top of each brief -->
  <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>

  <style>
    /* ---------- Design tokens (from Tim's UX playbook) ---------- */
    :root {
      --bg: #f5f0e8;           /* warm cream paper */
      --ink: #2c2416;          /* warm near-black for primary text */
      --ink-muted: #6b5f4a;    /* warm taupe for supporting text */
      --ink-soft: #8a7e67;     /* lighter warm taupe for metadata */
      --rule: #d4c9b3;         /* sand rule line */
      --rule-soft: #e4dcc8;    /* lighter sand for dashed rules */
      --accent: #8b3a1f;       /* terracotta for numerals and accents */

      --ease: cubic-bezier(0.25, 0.1, 0.25, 1);
      --ease-bloom: cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Root font size 17px so "1rem" inside story body equals the spec'd body size */
    html { font-size: 17px; }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: 'Literata', Georgia, serif;
      font-size: 1rem;                 /* 17px */
      line-height: 1.65;
      padding: 3rem 1.75rem 4rem;      /* 51px / 29.75px / 68px */
      max-width: 680px;
      margin: 0 auto;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    @media (max-width: 480px) {
      body { padding: 2rem 1.25rem 3rem; }
    }

    /* ---------- Entrance animation (opacity + translateY) ---------- */
    @keyframes enter {
      to { opacity: 1; transform: translateY(0); }
    }

    /* ---------- Masthead ---------- */
    header {
      position: relative;
      z-index: 2;
      text-align: center;
      padding-bottom: 1.5rem;
      border-bottom: 2px solid var(--ink);
      margin-bottom: 2.5rem;
      opacity: 0;
      transform: translateY(8px);
      animation: enter 0.5s var(--ease) forwards;
    }

    h1.masthead-title {
      font-family: 'DM Serif Display', Georgia, serif;
      font-size: 2.25rem;              /* ~38px */
      font-weight: 400;
      letter-spacing: 0.01em;
      color: var(--ink);
      margin-bottom: 0.5rem;
    }

    .masthead-date {
      font-family: 'Inter', sans-serif;
      font-size: 0.75rem;
      letter-spacing: 0.2em;
      color: var(--ink-soft);
      text-transform: uppercase;
    }

    .stale-banner {
      font-family: 'Inter', sans-serif;
      font-size: 0.7rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--ink-soft);
      margin-top: 0.75rem;
      font-style: normal;
    }

    /* ---------- Archive trigger ---------- */
    .archive-btn {
      position: absolute;
      top: 0;
      right: 0;
      min-width: 44px;
      min-height: 44px;
      padding: 0.5rem 0.9rem;
      background: transparent;
      border: 1px solid var(--rule);
      border-radius: 8px;
      color: var(--ink-muted);
      font-family: 'Inter', sans-serif;
      font-size: 0.7rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      cursor: pointer;
      /* Default transition covers RELEASE from :active (150ms ease-out). */
      transition:
        transform 150ms var(--ease),
        background 150ms var(--ease),
        color 150ms var(--ease),
        border-color 150ms var(--ease);
    }
    .archive-btn:hover {
      background: rgba(139, 58, 31, 0.06);
      color: var(--ink);
      border-color: var(--ink-muted);
    }
    /* Instant press: no transition while :active is held. */
    .archive-btn:active {
      transform: scale(0.95);
      transition: none;
    }
    .archive-btn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    /* ---------- Archive dropdown panel ---------- */
    .archive-panel {
      position: absolute;
      top: calc(100% - 0.75rem);
      right: 0;
      min-width: 200px;
      max-height: 360px;
      overflow-y: auto;
      background: var(--bg);
      border: 1px solid var(--rule);
      border-radius: 8px;
      box-shadow: 0 4px 16px rgba(44, 36, 22, 0.08);
      padding: 0.5rem 0;
      z-index: 10;

      opacity: 0;
      transform: translateY(-4px) scale(0.96);
      pointer-events: none;
      transition:
        opacity 0.25s var(--ease),
        transform 0.25s var(--ease);
    }
    .archive-panel.open {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: auto;
    }

    .archive-item {
      display: block;
      width: 100%;
      padding: 0.6rem 1rem;
      background: transparent;
      border: none;
      text-align: left;
      cursor: pointer;
      color: var(--ink);
      font-family: 'Inter', sans-serif;
      transition: background 150ms var(--ease), color 150ms var(--ease);
    }
    .archive-item:hover { background: rgba(139, 58, 31, 0.06); }
    .archive-item:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: -2px;
    }
    .archive-item.current { color: var(--accent); }

    .archive-item .date {
      font-size: 0.85rem;
      font-weight: 500;
    }
    .archive-item .day {
      font-size: 0.7rem;
      color: var(--ink-soft);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-top: 0.1rem;
    }
    .archive-item.current .day { color: var(--accent); opacity: 0.75; }

    .archive-empty {
      padding: 0.75rem 1rem;
      font-family: 'Literata', Georgia, serif;
      font-size: 0.85rem;
      color: var(--ink-soft);
      font-style: italic;
    }

    /* ---------- Content region (staggered entrance, 150ms delay) ---------- */
    #content {
      opacity: 0;
      transform: translateY(8px);
      animation: enter 0.5s var(--ease) 0.15s forwards;
    }

    .loading {
      text-align: center;
      font-style: italic;
      color: var(--ink-soft);
      padding: 3rem 0;
      font-size: 0.95rem;
    }

    .error-message {
      text-align: center;
      font-style: italic;
      color: var(--ink-soft);
      padding: 3rem 1rem;
      font-size: 1rem;
    }

    /* ---------- "At a glance" heading (entry small-caps H2) ---------- */
    #content h2.glance-heading {
      font-family: 'DM Serif Display', Georgia, serif;
      font-size: 0.85rem;
      font-weight: 400;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--accent);
      text-align: center;
      margin-bottom: 1.5rem;
    }

    /* ---------- "At a glance" ordered list (Roman numerals) ---------- */
    #content h2.glance-heading + ol {
      list-style: none;
      counter-reset: glance;
      padding: 0;
      margin-bottom: 2.5rem;
    }
    #content h2.glance-heading + ol li {
      counter-increment: glance;
      position: relative;
      padding: 0.75rem 0 0.75rem 2.25rem;
      border-bottom: 1px solid var(--rule-soft);
      font-family: 'Literata', Georgia, serif;
      font-size: 1rem;
      line-height: 1.5;
      color: var(--ink);
    }
    #content h2.glance-heading + ol li:last-child { border-bottom: none; }
    #content h2.glance-heading + ol li::before {
      content: counter(glance, upper-roman) ".";
      position: absolute;
      left: 0;
      top: 0.75rem;
      color: var(--accent);
      font-family: 'DM Serif Display', Georgia, serif;
      font-size: 1rem;
      letter-spacing: 0.05em;
    }

    /* ---------- Glance items: clickable ---------- */
    #content h2.glance-heading + ol li.glance-link {
      cursor: pointer;
      transition: color 150ms var(--ease), opacity 150ms var(--ease);
    }
    #content h2.glance-heading + ol li.glance-link:hover { color: var(--accent); }
    #content h2.glance-heading + ol li.glance-link:active { opacity: 0.6; }

    /* ---------- Story block wrapper (scroll target + glow) ---------- */
    .story-block {
      border-radius: 6px;
      scroll-margin-top: 1.5rem;
    }

    @keyframes story-glow-kf {
      0%   { box-shadow: 0 0 0 0px rgba(139, 58, 31, 0); }
      18%  { box-shadow: 0 0 0 2px rgba(139, 58, 31, 0.4), 0 0 28px rgba(139, 58, 31, 0.13); }
      100% { box-shadow: 0 0 0 0px rgba(139, 58, 31, 0); }
    }
    .story-block.story-glow {
      animation: story-glow-kf 1.8s var(--ease-bloom) forwards;
    }

    /* ---------- Horizontal rule after "At a glance" ---------- */
    #content hr {
      border: none;
      border-top: 1px solid var(--rule);
      margin: 2.5rem 0;
    }

    /* ---------- Lede (italic one-liner right after the hr) ---------- */
    #content p.lede {
      font-style: italic;
      color: var(--ink-muted);
      font-size: 1.05rem;
      text-align: center;
      margin-bottom: 2.5rem;
      line-height: 1.5;
    }
    #content p.lede em { font-style: italic; }

    /* ---------- Story headings ---------- */
    #content h2.story-heading {
      font-family: 'DM Serif Display', Georgia, serif;
      font-size: 1.45rem;
      font-weight: 400;
      line-height: 1.3;
      border-top: 1px solid var(--rule);
      padding-top: 1.5rem;
      margin-top: 2.5rem;
      margin-bottom: 0.75rem;
      color: var(--ink);
      letter-spacing: 0.005em;
    }
    #content h2.story-heading.first {
      border-top: none;
      padding-top: 0;
      margin-top: 2rem;
    }

    /* ---------- Story metadata line (bold line right under the story H2) ---------- */
    #content p.story-meta {
      font-family: 'Inter', sans-serif;
      font-size: 0.75rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ink-muted);
      margin-bottom: 1rem;
      font-weight: 500;
    }
    #content p.story-meta strong { font-weight: 500; }

    /* ---------- Body paragraphs ---------- */
    #content p {
      font-family: 'Literata', Georgia, serif;
      font-size: 1rem;
      line-height: 1.65;
      margin-bottom: 1rem;
      color: var(--ink);
    }

    #content strong { color: var(--ink); font-weight: 600; }
    #content em { color: inherit; }

    /* ---------- "Why it matters" block ---------- */
    #content p.why-it-matters {
      font-family: 'Literata', Georgia, serif;
      font-size: 0.95rem;
      font-style: italic;
      color: var(--ink-muted);
      border-top: 1px dashed var(--rule);
      padding-top: 0.75rem;
      margin-top: 1rem;
    }
    #content p.why-it-matters em:first-child {
      color: var(--accent);
      font-weight: 500;
      font-style: italic;
    }

    /* ---------- Minor sections ("Under the radar", "Feedback questions") ---------- */
    #content h2.section-minor {
      font-family: 'DM Serif Display', Georgia, serif;
      font-size: 0.85rem;
      font-weight: 400;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--accent);
      text-align: center;
      border-top: 2px solid var(--ink);
      padding-top: 3rem;
      margin-top: 3rem;
      margin-bottom: 1.5rem;
    }

    /* ---------- Minor-section ordered/unordered lists ---------- */
    #content h2.section-minor ~ ol,
    #content h2.section-minor ~ ul {
      padding-left: 1.25rem;
      margin-bottom: 1rem;
      color: var(--ink);
    }
    #content h2.section-minor ~ ol li,
    #content h2.section-minor ~ ul li {
      margin-bottom: 0.5rem;
      line-height: 1.55;
    }

    /* ---------- Sources button (mirrors archive-btn on left side) ---------- */
    .sources-btn {
      position: absolute;
      top: 0;
      left: 0;
      min-width: 44px;
      min-height: 44px;
      padding: 0.5rem 0.9rem;
      background: transparent;
      border: 1px solid var(--rule);
      border-radius: 8px;
      color: var(--ink-muted);
      font-family: 'Inter', sans-serif;
      font-size: 0.7rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      cursor: pointer;
      transition:
        transform 150ms var(--ease),
        background 150ms var(--ease),
        color 150ms var(--ease),
        border-color 150ms var(--ease);
    }
    .sources-btn:hover {
      background: rgba(139, 58, 31, 0.06);
      color: var(--ink);
      border-color: var(--ink-muted);
    }
    .sources-btn:active {
      transform: scale(0.95);
      transition: none;
    }
    .sources-btn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    /* ---------- Sources modal overlay ---------- */
    .sources-overlay {
      position: fixed;
      inset: 0;
      background: rgba(44, 36, 22, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 1rem;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      /* visibility delay matches opacity so element hides only after fade-out completes */
      transition: opacity 0.2s var(--ease), visibility 0s 0.2s;
    }
    .sources-overlay.open {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transition: opacity 0.2s var(--ease), visibility 0s;
    }

    .sources-modal {
      background: var(--bg);
      border: 1px solid var(--rule);
      border-radius: 12px;
      box-shadow: 0 8px 40px rgba(44, 36, 22, 0.18);
      max-width: 560px;
      width: 100%;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transform: translateY(10px) scale(0.97);
      transition: transform 0.2s var(--ease);
    }
    .sources-overlay.open .sources-modal {
      transform: translateY(0) scale(1);
    }

    .sources-modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.25rem 1.5rem 1rem;
      border-bottom: 1px solid var(--rule);
      flex-shrink: 0;
    }
    .sources-modal-title {
      font-family: 'DM Serif Display', Georgia, serif;
      font-size: 0.8rem;
      font-weight: 400;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--accent);
    }
    .sources-modal-close {
      background: transparent;
      border: 1px solid var(--rule);
      border-radius: 6px;
      color: var(--ink-soft);
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      font-size: 0.68rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 0.35rem 0.65rem;
      transition: color 150ms, border-color 150ms, background 150ms;
    }
    .sources-modal-close:hover {
      color: var(--ink);
      border-color: var(--ink-muted);
      background: rgba(139, 58, 31, 0.04);
    }
    .sources-modal-close:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .sources-modal-body {
      overflow-y: auto;
      padding: 1.25rem 1.5rem 1.75rem;
      -webkit-overflow-scrolling: touch;
    }

    .source-group {
      margin-bottom: 1.75rem;
    }
    .source-group:last-child { margin-bottom: 0; }

    .source-group-label {
      font-family: 'Inter', sans-serif;
      font-size: 0.68rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 0.35rem;
    }
    .source-group-why {
      font-family: 'Literata', Georgia, serif;
      font-size: 0.82rem;
      font-style: italic;
      color: var(--ink-muted);
      margin-bottom: 0.75rem;
      line-height: 1.5;
    }

    .source-item {
      padding: 0.45rem 0 0.45rem 0.85rem;
      border-left: 2px solid var(--rule-soft);
      margin-bottom: 0.45rem;
    }
    .source-item:last-child { margin-bottom: 0; }

    .source-link {
      display: block;
      font-family: 'Literata', Georgia, serif;
      font-size: 0.88rem;
      color: var(--ink);
      text-decoration: none;
      line-height: 1.45;
      border-bottom: 1px solid transparent;
      transition: color 150ms, border-color 150ms;
    }
    .source-link:hover {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }
    .source-domain {
      font-family: 'Inter', sans-serif;
      font-size: 0.68rem;
      color: var(--ink-soft);
      margin-top: 0.15rem;
      letter-spacing: 0.04em;
    }
  </style>
</head>
<body>
  <header>
    <h1 class="masthead-title">The Morning Brief</h1>
    <div class="masthead-date" id="masthead-date">Loading&hellip;</div>
    <div class="stale-banner" id="stale-banner" style="display:none;"></div>
    <button class="sources-btn" id="sources-btn" style="display:none;" aria-haspopup="dialog">Sources</button>
    <button class="archive-btn" id="archive-btn" aria-expanded="false" aria-haspopup="menu">Archive</button>
    <div class="archive-panel" id="archive-panel" role="menu"></div>
  </header>

  <!-- Sources modal -->
  <div class="sources-overlay" id="sources-overlay" role="dialog" aria-modal="true" aria-labelledby="sources-modal-title">
    <div class="sources-modal">
      <div class="sources-modal-header">
        <span class="sources-modal-title" id="sources-modal-title">Sources</span>
        <button class="sources-modal-close" id="sources-modal-close" aria-label="Close sources">Close</button>
      </div>
      <div class="sources-modal-body" id="sources-modal-body"></div>
    </div>
  </div>

  <main id="content">
    <div class="loading">Loading&hellip;</div>
  </main>

  <script>
    /* =====================================================================
       CONFIG
       ===================================================================== */
    const REPO_RAW_BASE = 'https://raw.githubusercontent.com/cubicleaf/Tech-New/main/briefs';

    /* =====================================================================
       UTILITIES
       ===================================================================== */

    // Cache buster — appended to every fetch so Fastly (GitHub's raw CDN) can't
    // serve stale content within its ~5-minute cache window.
    const cb = () => `?t=${Date.now()}`;

    // Format "2026-04-24" as "April 24, 2026" using UTC so the calendar date
    // never drifts from the stored string.
    function formatDateLong(dateStr) {
      const [y, m, d] = dateStr.split('-').map(Number);
      const dt = new Date(Date.UTC(y, m - 1, d));
      return new Intl.DateTimeFormat('en-US', {
        month: 'long', day: 'numeric', year: 'numeric', timeZone: 'UTC'
      }).format(dt);
    }

    // Today's date (YYYY-MM-DD) in America/New_York — used for the stale banner.
    function todayInEastern() {
      const now = new Date();
      const parts = new Intl.DateTimeFormat('en-CA', {
        timeZone: 'America/New_York',
        year: 'numeric', month: '2-digit', day: '2-digit'
      }).formatToParts(now);
      const get = t => parts.find(p => p.type === t).value;
      return `${get('year')}-${get('month')}-${get('day')}`;
    }

    function dayOfWeek(dateStr) {
      const [y, m, d] = dateStr.split('-').map(Number);
      const dt = new Date(Date.UTC(y, m - 1, d, 12));
      return new Intl.DateTimeFormat('en-US', { weekday: 'long', timeZone: 'UTC' }).format(dt);
    }

    /* =====================================================================
       FRONTMATTER PARSING
       ===================================================================== */

    // Splits the file into { frontmatter, body } using the --- fence at the top.
    function parseFrontmatter(text) {
      const fm = /^---\n([\s\S]*?)\n---\n?([\s\S]*)$/.exec(text);
      if (!fm) return { frontmatter: {}, body: text };
      try {
        const frontmatter = jsyaml.load(fm[1]) || {};
        // js-yaml v4 parses bare YYYY-MM-DD values as Date objects; normalize back to string
        if (frontmatter.date instanceof Date) {
          const d = frontmatter.date;
          frontmatter.date = `${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,'0')}-${String(d.getUTCDate()).padStart(2,'0')}`;
        }
        return { frontmatter, body: fm[2] };
      } catch (err) {
        console.warn('Frontmatter parse error:', err);
        return { frontmatter: {}, body: fm[2] };
      }
    }

    /* =====================================================================
       BRIEF LOADING
       ===================================================================== */

    async function loadBrief(dateParam) {
      const path = dateParam ? `${dateParam}.md` : 'latest.md';
      const url = `${REPO_RAW_BASE}/${path}${cb()}`;

      try {
        const res = await fetch(url);
        if (!res.ok) throw new Error(`fetch failed: ${res.status}`);
        const raw = await res.text();
        const { frontmatter, body } = parseFrontmatter(raw);

        renderMasthead(frontmatter);
        renderContent(body);
        renderSources(frontmatter.sources || null);
        checkStale(frontmatter, !dateParam);
      } catch (err) {
        console.error('Brief fetch failed:', err);
        const detail = err && err.message ? err.message : String(err);
        document.getElementById('content').innerHTML =
          `<div class="error-message">No brief available yet. Check back at 6:30 AM Eastern.<br><small style="opacity:0.6;font-size:0.75rem">${detail}</small></div>`;
        document.getElementById('masthead-date').textContent = '';
        document.getElementById('stale-banner').style.display = 'none';
      }
    }

    function renderMasthead(fm) {
      const date = fm.date;
      if (!date) {
        document.getElementById('masthead-date').textContent = '';
        return;
      }
      const day = (fm.day || dayOfWeek(date)).toUpperCase();
      const formatted = formatDateLong(date).toUpperCase();
      document.getElementById('masthead-date').textContent = `${day} \u00B7 ${formatted}`;
    }

    function checkStale(fm, isLatest) {
      const banner = document.getElementById('stale-banner');
      if (!isLatest || !fm.date) { banner.style.display = 'none'; return; }
      if (fm.date < todayInEastern()) {
        const day = fm.day || dayOfWeek(fm.date);
        banner.textContent = `Last brief \u00B7 ${day} \u00B7 ${formatDateLong(fm.date)}`;
        banner.style.display = 'block';
      } else {
        banner.style.display = 'none';
      }
    }

    function renderContent(body) {
      const html = marked.parse(body);
      const content = document.getElementById('content');
      content.innerHTML = html;
      tagStructure(content);
      wrapStories(content);
      wireGlanceLinks(content);
    }

    function wrapStories(root) {
      Array.from(root.querySelectorAll('h2.story-heading')).forEach((h2, idx) => {
        const elements = [h2];
        let next = h2.nextElementSibling;
        while (next && next.tagName !== 'H2' && next.tagName !== 'HR') {
          elements.push(next);
          next = next.nextElementSibling;
        }
        const wrap = document.createElement('div');
        wrap.className = 'story-block';
        wrap.id = `story-${idx + 1}`;
        h2.parentNode.insertBefore(wrap, h2);
        elements.forEach(el => wrap.appendChild(el));
      });
    }

    function wireGlanceLinks(root) {
      const list = root.querySelector('h2.glance-heading + ol');
      if (!list) return;
      list.querySelectorAll('li').forEach((li, idx) => {
        li.classList.add('glance-link');
        li.addEventListener('click', () => scrollToStory(idx + 1));
      });
    }

    function scrollToStory(num) {
      const block = document.getElementById(`story-${num}`);
      if (!block) return;
      block.scrollIntoView({ behavior: 'smooth', block: 'start' });
      block.classList.remove('story-glow');
      void block.offsetWidth;
      block.classList.add('story-glow');
      block.addEventListener('animationend', () => block.classList.remove('story-glow'), { once: true });
    }

    /* =====================================================================
       STRUCTURAL CLASS TAGGING
       ---------------------------------------------------------------------
       We style by POSITION, not by text content. Rules:
         - Remove the rendered <h1> (masthead already displays the title).
         - First <h2> in the document becomes .glance-heading.
         - Remaining <h2>s whose text starts with a digit + "." are story
           headings; all others (at the tail) are minor sections.
         - For each story: the next <p> whose firstChild is <strong> is the
           metadata line; a <p> whose first <em> starts with "why it matters"
           is the "why it matters" line.
         - The <p> immediately after the <hr> whose only content is <em> is
           the lede.
       ===================================================================== */
    function tagStructure(root) {
      const h1 = root.querySelector('h1');
      if (h1) h1.remove();

      const h2s = Array.from(root.querySelectorAll('h2'));
      if (h2s.length === 0) return;

      // First H2: "At a glance"
      h2s[0].classList.add('glance-heading');

      // Remaining H2s
      let firstStory = true;
      for (let i = 1; i < h2s.length; i++) {
        const h2 = h2s[i];
        const txt = h2.textContent.trim();

        if (/^\d+\./.test(txt)) {
          h2.classList.add('story-heading');
          if (firstStory) { h2.classList.add('first'); firstStory = false; }

          // Metadata line: first <p> after this h2 whose first child is <strong>
          let sib = h2.nextElementSibling;
          while (sib && sib.tagName !== 'P' && sib.tagName !== 'H2') {
            sib = sib.nextElementSibling;
          }
          if (sib && sib.tagName === 'P'
              && sib.firstChild && sib.firstChild.nodeName === 'STRONG') {
            sib.classList.add('story-meta');
          }

          // "Why it matters" paragraph: walk forward until next h2
          let walker = h2.nextElementSibling;
          while (walker && walker.tagName !== 'H2') {
            if (walker.tagName === 'P') {
              const em = walker.querySelector('em');
              if (em && /^why it matters/i.test(em.textContent.trim())) {
                walker.classList.add('why-it-matters');
                break;
              }
            }
            walker = walker.nextElementSibling;
          }
        } else {
          h2.classList.add('section-minor');
        }
      }

      // Lede: first <p> after the <hr> whose textContent equals its <em>
      const hr = root.querySelector('hr');
      if (hr) {
        let next = hr.nextElementSibling;
        while (next && next.tagName !== 'P' && next.tagName !== 'H2') {
          next = next.nextElementSibling;
        }
        if (next && next.tagName === 'P') {
          const em = next.querySelector('em');
          if (em && next.textContent.trim() === em.textContent.trim()) {
            next.classList.add('lede');
          }
        }
      }
    }

    /* =====================================================================
       SOURCES MODAL
       ===================================================================== */

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function parseDomain(url) {
      try { return new URL(url).hostname.replace(/^www\./, ''); } catch { return ''; }
    }

    function renderSources(sources) {
      const btn = document.getElementById('sources-btn');
      const body = document.getElementById('sources-modal-body');
      if (!sources || !sources.length) {
        btn.style.display = 'none';
        body.innerHTML = '';
        return;
      }
      btn.style.display = '';
      body.innerHTML = sources.map(group => {
        const links = (group.links || []).map(link =>
          `<div class="source-item">
            <a class="source-link" href="${escapeHtml(link.url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(link.title)}</a>
            <div class="source-domain">${escapeHtml(parseDomain(link.url))}</div>
          </div>`
        ).join('');
        return `<div class="source-group">
          <div class="source-group-label">${escapeHtml(group.group || '')}</div>
          ${group.why ? `<div class="source-group-why">${escapeHtml(group.why)}</div>` : ''}
          ${links}
        </div>`;
      }).join('');
    }

    function openSources() {
      const overlay = document.getElementById('sources-overlay');
      overlay.classList.add('open');
      document.getElementById('sources-modal-close').focus();
      document.body.style.overflow = 'hidden';
    }

    function closeSources() {
      const overlay = document.getElementById('sources-overlay');
      overlay.classList.remove('open');
      document.body.style.overflow = '';
      document.getElementById('sources-btn').focus();
    }

    document.getElementById('sources-btn').addEventListener('click', openSources);
    document.getElementById('sources-modal-close').addEventListener('click', closeSources);

    document.getElementById('sources-overlay').addEventListener('click', e => {
      if (e.target === document.getElementById('sources-overlay')) closeSources();
    });

    /* =====================================================================
       ARCHIVE — stateless rewrite
       No pushState, no URL params, no popstate. State lives in memory only.
       ===================================================================== */

    const archiveState = { loaded: false, items: [], currentDate: null };

    async function loadArchive() {
      if (archiveState.loaded) { renderArchive(); return; }
      try {
        const res = await fetch(`${REPO_RAW_BASE}/index.json${cb()}`);
        if (!res.ok) throw new Error(`index fetch failed: ${res.status}`);
        archiveState.items = await res.json();
        archiveState.loaded = true;
        renderArchive();
      } catch (err) {
        console.error('Archive fetch failed:', err);
        document.getElementById('archive-panel').innerHTML =
          '<div class="archive-empty">Archive unavailable</div>';
      }
    }

    function renderArchive() {
      const panel = document.getElementById('archive-panel');
      panel.innerHTML = '';
      const items = archiveState.items;
      if (!Array.isArray(items) || items.length === 0) {
        panel.innerHTML = '<div class="archive-empty">No briefs yet.</div>';
        return;
      }
      items.forEach((item, idx) => {
        const btn = document.createElement('button');
        btn.className = 'archive-item';
        btn.setAttribute('role', 'menuitem');
        btn.dataset.date = item.date;
        btn.innerHTML =
          `<div class="date">${formatDateLong(item.date)}</div>` +
          `<div class="day">${item.day}</div>`;
        const isCurrent = archiveState.currentDate
          ? item.date === archiveState.currentDate
          : idx === 0;
        if (isCurrent) btn.classList.add('current');
        btn.addEventListener('click', () => navigateTo(item.date));
        panel.appendChild(btn);
      });
    }

    function navigateTo(date) {
      archiveState.currentDate = date;
      togglePanel(false);
      document.getElementById('content').innerHTML = '<div class="loading">Loading&hellip;</div>';
      loadBrief(date);
    }

    function togglePanel(force) {
      const panel = document.getElementById('archive-panel');
      const archiveBtn = document.getElementById('archive-btn');
      const shouldOpen = typeof force === 'boolean' ? force : !panel.classList.contains('open');
      panel.classList.toggle('open', shouldOpen);
      archiveBtn.setAttribute('aria-expanded', String(shouldOpen));
      if (shouldOpen) loadArchive();
    }

    document.getElementById('archive-btn').addEventListener('click', e => {
      e.stopPropagation();
      togglePanel();
    });

    document.addEventListener('click', e => {
      const panel = document.getElementById('archive-panel');
      const archiveBtn = document.getElementById('archive-btn');
      if (!panel.contains(e.target) && !archiveBtn.contains(e.target)) {
        togglePanel(false);
      }
    });

    document.addEventListener('keydown', e => {
      if (e.key !== 'Escape') return;
      if (document.getElementById('sources-overlay').classList.contains('open')) {
        closeSources();
      } else {
        togglePanel(false);
      }
    });

    /* =====================================================================
       INIT
       ===================================================================== */
    loadBrief(null);
  </script>
</body>
</html>
